name: test

on:
  # Pushes to master are tested by release-on-merge, which releases only on success.
  workflow_call:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        rmq_version: ["3.10", "3.11", "3.12", "3.13"]

    env:
      RABBITMQ_VERSION: ${{ matrix.rmq_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24

      # Without TF_ACC_TERRAFORM_PATH, the acceptance tests download Terraform with
      # hc-install, which fails once its embedded HashiCorp signing key expires.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Use the installed Terraform for acceptance tests
        run: echo "TF_ACC_TERRAFORM_PATH=$(which terraform)" >> "$GITHUB_ENV"

      - name: test
        run: make test

      - name: vet
        run: make vet

      - name: testacc
        run: make testacc
